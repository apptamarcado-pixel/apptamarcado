<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tá Marcado</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #003366; }
        
        .foto-box { width: 100px; height: 100px; border: 2px dashed #003366; margin: 10px auto; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; overflow: hidden; }
        .foto-box img { width: 100%; height: 100%; object-fit: cover; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; }
        
        .btn-acao { width: 100%; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; margin: 5px 0; cursor: pointer; }
        .btn-salvar { background-color: #003366; }
        .btn-enviar { background-color: #28a745; }
        .btn-tabela { background-color: #6c757d; }
        
        .links-portal { display: flex; gap: 10px; margin-top: 20px; }
        .btn-link { flex: 1; padding: 10px; text-align: center; background: #e9ecef; text-decoration: none; color: #333; border-radius: 8px; font-weight: bold; font-size: 14px; }
        
        #tabela-container { display: none; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #003366; color: white; padding: 10px; }
        td { border-bottom: 1px solid #ddd; padding: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>TÁ MARCADO</h1>
    
    <div class="foto-box" onclick="document.getElementById('inputFoto').click()">
        <span id="txt-foto">+ Foto</span>
        <input type="file" id="inputFoto" style="display:none" accept="image/*" onchange="carregarFoto(event)">
    </div>

    <input type="text" id="nome" placeholder="NOME DO CLIENTE">
    <input type="date" id="data">
    <input type="time" id="hora">
    <input type="text" id="prof" placeholder="PROFISSIONAL">
    <input type="text" id="local" placeholder="LOCAL">

    <button class="btn-acao btn-salvar" onclick="salvar()">SALVAR</button>
    <button class="btn-acao btn-enviar" onclick="enviarWhatsApp()">ENVIAR (WHATSAPP)</button>
    <button class="btn-acao btn-tabela" onclick="toggleTabela()">VER MARCADOS</button>

    <div class="links-portal">
        <a href="https://painel.saude.rj.gov.br/RelatorioSER/ListaEsperaAmbulatorial.html" class="btn-link" target="_blank">SER</a>
        <a href="https://web2.smsrio.org/portalPaciente/login/#/" class="btn-link" target="_blank">SISREG</a>
    </div>

    <div id="tabela-container">
        <table>
            <thead><tr><th>DATA</th><th>HORA</th><th>PROF.</th><th>LOCAL</th></tr></thead>
            <tbody id="corpo-tabela"></tbody>
        </table>
    </div>
</div>

<script>
    function carregarFoto(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            document.querySelector('.foto-box').innerHTML = `<img src="${e.target.result}">`;
        }
        reader.readAsDataURL(file);
    }

    function salvar() {
        let lista = JSON.parse(localStorage.getItem('marcacoes')) || [];
        let nova = {
            data: document.getElementById('data').value.split('-').reverse().join('/'),
            hora: document.getElementById('hora').value,
            prof: document.getElementById('prof').value,
            local: document.getElementById('local').value
        };
        lista.push(nova);
        localStorage.setItem('marcacoes', JSON.stringify(lista));
        alert("Salvo com sucesso!");
        renderizar();
    }

    function renderizar() {
        let lista = JSON.parse(localStorage.getItem('marcacoes')) || [];
        document.getElementById('corpo-tabela').innerHTML = lista.map(i => 
            `<tr><td>${i.data}</td><td>${i.hora}</td><td>${i.prof}</td><td>${i.local}</td></tr>`
        ).join('');
    }

    function toggleTabela() {
        let div = document.getElementById('tabela-container');
        div.style.display = div.style.display === 'block' ? 'none' : 'block';
        renderizar();
    }

    function enviarWhatsApp() {
        let msg = `Nova Marcação:%0A- Profissional: ${document.getElementById('prof').value}%0A- Local: ${document.getElementById('local').value}%0A- Data/Hora: ${document.getElementById('data').value} às ${document.getElementById('hora').value}`;
        window.open(`https://wa.me/?text=${msg}`, '_blank');
    }
</script>
</body>
</html>
